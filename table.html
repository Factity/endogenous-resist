<body>

    <div class="gfsae-wrapper" id="gfsae-wrapper">
        <button class="gfsae-toggle-btn" id="gfsae-themeToggle" onclick="gfsae_toggleTheme()">Light</button>

        <main class="gfsae-container">
            <h1>🔍 GoodFire 8B SAE Feature Lookup</h1>
            <p class="gfsae-subtitle">
                Layer 19 Sparse Autoencoder Feature Labels – <strong>semantic vector search</strong> (local AI)
            </p>

            <div class="gfsae-controls">
                <input type="text" id="gfsae-searchInput" placeholder="Describe what you're looking for…" />
                <select id="gfsae-splitFilter">
                    <option value="all">All Splits</option>
                    <option value="train">Train</option>
                    <option value="val">Validation</option>
                </select>
                <span class="gfsae-status" id="gfsae-status">⏳ initializing…</span>
            </div>

            <div class="gfsae-stats" id="gfsae-stats">Loading features…</div>

            <div id="gfsae-content">
                <div class="gfsae-loading">Loading features &amp; embedding model…</div>
            </div>

            <div class="gfsae-footer">GoodFire/Llama-3.1-8B-Instruct-SAE-l19 · Layer 19</div>
        </main>
    </div>

    <!-- Import map for ferrovec and transformers.js -->
    <script type="importmap">
        {
            "imports": {
                "ferrovec": "https://cdn.jsdelivr.net/npm/ferrovec@0.2.0/dist/index.js",
                "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js"
            }
        }
    </script>

    <script type="module">
        // ---------- IMPORTS ----------
        import { Ferrovec } from 'ferrovec';

        // ---------- DOM refs ----------
        const wrapper = document.getElementById('gfsae-wrapper');
        const searchInput = document.getElementById('gfsae-searchInput');
        const splitFilter = document.getElementById('gfsae-splitFilter');
        const statsEl = document.getElementById('gfsae-stats');
        const contentEl = document.getElementById('gfsae-content');
        const statusEl = document.getElementById('gfsae-status');

        // ---------- STATE ----------
        let allFeatures = [];
        let filteredFeatures = [];
        let sortField = 'index';
        let sortDirection = 'asc';
        let db = null; // ferrovec instance
        let isSemanticReady = false;
        let fallbackMode = false; // true if semantic fails

        // ---------- THEME ----------
        window.gfsae_toggleTheme = function() {
            wrapper.classList.toggle('gfsae-light');
            const btn = document.getElementById('gfsae-themeToggle');
            btn.textContent = wrapper.classList.contains('gfsae-light') ? 'Dark' : 'Light';
        };

        // ---------- UTILITY ----------
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ---------- LOAD DATA (handles your nested JSON) ----------
        async function loadData() {
            const paths = [
                wrapper.dataset.jsonUrl,
                'goodfire_8b_sae_labels.json',
                './goodfire_8b_sae_labels.json',
                'jsonfolder/goodfire_8b_sae_labels.json',
                './jsonfolder/goodfire_8b_sae_labels.json'
            ].filter(Boolean);

            let lastError = null;
            for (const url of paths) {
                try {
                    console.log(`[GFSAE] Fetching ${url}`);
                    const resp = await fetch(url);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const data = await resp.json();

                    // ---- Detect the structure ----
                    let features = null;

                    // Case 1: top-level "vectors" array
                    if (data.vectors && Array.isArray(data.vectors)) {
                        features = data.vectors;
                    }
                    // Case 2: array of objects, each with a "vectors" array (your case)
                    else if (Array.isArray(data) && data.length > 0 && data[0].vectors) {
                        features = [];
                        for (const entry of data) {
                            if (entry.vectors && Array.isArray(entry.vectors)) {
                                features.push(...entry.vectors);
                            }
                        }
                    }
                    // Case 3: the entire array is the feature list (direct)
                    else if (Array.isArray(data) && data.length > 0 && data[0].index !== undefined) {
                        features = data;
                    }

                    if (!features || !features.length) {
                        throw new Error('Could not find feature list in the JSON structure.');
                    }

                    allFeatures = features;
                    console.log(`✅ Loaded ${allFeatures.length} features from ${url}`);
                    return true;
                } catch (err) {
                    lastError = err;
                    console.warn(`Failed from ${url}: ${err.message}`);
                }
            }

            contentEl.innerHTML = `
                <div class="gfsae-error">
                    <strong>Failed to load JSON</strong><br><br>
                    Last error: ${lastError?.message || 'Unknown'}<br><br>
                    Tried: ${paths.join(', ')}<br><br>
                    <button onclick="location.reload()" style="padding:8px 20px;font-size:1rem;cursor:pointer;">🔄 Retry</button>
                </div>
            `;
            statsEl.textContent = 'Error loading data';
            return false;
        }

        // ---------- BUILD SEMANTIC INDEX ----------
        async function buildSemanticIndex() {
            try {
                statusEl.textContent = '⏳ loading model…';
                statusEl.className = 'gfsae-status';

                db = await Ferrovec.open('gfsae-features');

                const alreadyIndexed = sessionStorage.getItem('gfsae_indexed') === 'true';
                if (!alreadyIndexed) {
                    const insertPromises = allFeatures.map(f => {
                        const text = (f.labels || []).join(' ');
                        return db.insert(text, { id: String(f.index) });
                    });
                    await Promise.all(insertPromises);
                    sessionStorage.setItem('gfsae_indexed', 'true');
                    console.log(`🔍 Indexed ${allFeatures.length} features`);
                } else {
                    console.log('ℹ️ Using cached index');
                }

                isSemanticReady = true;
                statusEl.textContent = '✅ semantic search ready';
                statusEl.className = 'gfsae-status loaded';
                return true;
            } catch (err) {
                console.error('Semantic index failed:', err);
                statusEl.textContent = '⚠️ semantic unavailable (fallback)';
                statusEl.className = 'gfsae-status error';
                fallbackMode = true;
                return false;
            }
        }

        // ---------- SEARCH (empty => show nothing) ----------
        async function performSearch() {
            const query = searchInput.value.trim();
            const split = splitFilter.value;

            // --- If query is empty, show nothing ---
            if (!query) {
                filteredFeatures = [];
                renderTable();      // will show empty hint
                updateStats();
                return;
            }

            let results = [];

            if (query && isSemanticReady && !fallbackMode) {
                try {
                    const raw = await db.query(query, 200);
                    const idSet = new Set(raw.map(r => r.id));
                    results = allFeatures.filter(f => idSet.has(String(f.index)));
                    const orderMap = {};
                    raw.forEach((r, i) => { orderMap[r.id] = i; });
                    results.sort((a, b) => orderMap[String(a.index)] - orderMap[String(b.index)]);
                } catch (err) {
                    console.warn('Semantic query failed, falling back to substring', err);
                    fallbackMode = true;
                    statusEl.textContent = '⚠️ fallback (substring)';
                    statusEl.className = 'gfsae-status error';
                }
            }

            // Fallback: substring match
            if (!results || !results.length) {
                const lowerQuery = query.toLowerCase();
                results = allFeatures.filter(f =>
                    (f.labels || []).some(label => label.toLowerCase().includes(lowerQuery))
                );
            }

            if (split !== 'all') {
                results = results.filter(f => f.split === split);
            }

            filteredFeatures = results;
            applySort();
            renderTable();
            updateStats();
        }

        // ---------- SORTING ----------
        function applySort() {
            filteredFeatures.sort((a, b) => {
                let va, vb;
                if (sortField === 'index') { va = a.index;
                    vb = b.index; } else if (sortField === 'split') { va = a.split;
                    vb = b.split; } else { va = (a.labels || []).join(' ').toLowerCase();
                    vb = (b.labels || []).join(' ').toLowerCase(); }
                if (va < vb) return sortDirection === 'asc' ? -1 : 1;
                if (va > vb) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });
        }

        window.gfsae_toggleSort = function(field) {
            if (sortField === field) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortField = field;
                sortDirection = 'asc';
            }
            applySort();
            renderTable();
        };

        // ---------- RENDER (shows empty hint when no results) ----------
        function renderTable() {
            if (!filteredFeatures.length) {
                // If we have loaded data but no query, show a helpful message
                const hasQuery = searchInput.value.trim().length > 0;
                const message = hasQuery ?
                    'No features match your search.' :
                    'Type a search term to find features.';
                const hint = hasQuery ? '' : '<small>Semantic search works best with descriptive phrases.</small>';
                contentEl.innerHTML = `
                    <div class="gfsae-empty-hint">
                        ${message}
                        ${hint}
                    </div>
                `;
                return;
            }

            const rows = filteredFeatures.map(f => {
                const labels = (f.labels || []).map(l => `<div>${escapeHtml(l)}</div>`).join('');
                const splitClass = f.split === 'train' ? 'gfsae-split-train' : 'gfsae-split-val';
                return `
                    <tr>
                        <td class="gfsae-feature-id">#${f.index}</td>
                        <td>${labels}</td>
                        <td><span class="gfsae-split-badge ${splitClass}">${f.split}</span></td>
                    </tr>
                `;
            }).join('');

            const arrow = '<span class="gfsae-sort-arrow"></span>';
            const clsIndex = sortField === 'index' ? `gfsae-sort-${sortDirection}` : '';
            const clsLabel = sortField === 'labels' ? `gfsae-sort-${sortDirection}` : '';
            const clsSplit = sortField === 'split' ? `gfsae-sort-${sortDirection}` : '';

            contentEl.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th class="${clsIndex}" onclick="gfsae_toggleSort('index')" style="width:100px;">Feature ID${arrow}</th>
                            <th class="${clsLabel}" onclick="gfsae_toggleSort('labels')">Description${arrow}</th>
                            <th class="${clsSplit}" onclick="gfsae_toggleSort('split')" style="width:120px;">Split${arrow}</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function updateStats() {
            const total = allFeatures.length;
            const showing = filteredFeatures.length;
            statsEl.innerHTML = `Showing <span>${showing}</span> of <span>${total}</span> features`;
        }

        // ---------- INIT ----------
        async function init() {
            const dataOk = await loadData();
            if (!dataOk) return;

            await buildSemanticIndex();

            // Start with empty state
            filteredFeatures = [];
            renderTable();
            updateStats();

            searchInput.addEventListener('input', performSearch);
            splitFilter.addEventListener('change', performSearch);

            if (fallbackMode) {
                statusEl.textContent = '⚠️ using substring search';
                statusEl.className = 'gfsae-status error';
            }
        }

        init();
    </script>

</body>
</html>
